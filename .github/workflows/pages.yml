# Builds the site and publishes it to GitHub Pages on every push to main.
# Turn on Pages once: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund sharp@0.35
      - run: node -e "const s=require('sharp');console.log(s.versions)"
      - run: node scripts/process-images.mjs
      - run: BASE_PATH=/${{ github.event.repository.name }} node src/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
